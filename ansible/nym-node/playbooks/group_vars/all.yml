---
###############################################################################
## GLOBAL VARS
## These values will be used globally unless overwritten per node in inventory/all
## Set these vars only if you want them globally for all nodes
## Per node changes in inventory/all will overwrite these global vars
###############################################################################

## MANDATORY - uncomment & define

## --SSH--
#ansible_user: root                                  # used for ssh, like `ssh root@nym-exit.ch-1.mynodes.net`
# ansible_ssh_private_key_file: ~/.ssh/<SSH_KEY>

## --Operator info--
# email: "<EMAIL>"                                  # used in certbot, description.toml and landing page
# website: "<WEBSITE>"                              # it is used in the description.toml
# description: "<NODE_PUBLIC_DESCRIPTION>"          # or define per node in inventory/all
# moniker: "<MONIKER>"

## --Node defaults (can override per node in inventory/all)--
# accept_operator_terms: true                       # controls --accept-operator-terms-and-conditions, read: https://nym.com/docs/operators/nodes/nym-node/setup#terms--conditions
# mode: exit-gateway                                # entry-gateway/exit-gateway/mixnode
# wireguard_enabled: true                           # true/false
hostname: ""                                        # keep this fallback, keep it and setup hostname per node in inventory/all

## OPTIONAL - uncomment & define

# operator_name: "<OPERATOR_NAME>"          # used in landing page if provided
# nym_version: "nym-binaries-v2026.7-tola"  # to use particular version instead of Latest, provide in such form:

## alternative SSH key var setting, instead of a hardcoded path
## useful if the playbook is shared in a repo by more admins with each having own local key
# ansible_ssh_private_key_file: "{{ lookup('env', '<YOUR_ANSIBLE SSH_KEY_ENV_VAR>') }}"

###############################################################################
## GLOBAL PACKAGES & URLs
## These will be installed during deployment
###############################################################################

nym_cli_url: "https://github.com/nymtech/nym/releases/download/{{ nym_version }}/nym-cli"
tunnel_manager_url: "https://github.com/nymtech/nym/raw/refs/heads/develop/scripts/nym-node-setup/network-tunnel-manager.sh"
quic_bridge_deployment_url: "https://raw.githubusercontent.com/nymtech/nym/refs/heads/develop/scripts/nym-node-setup/quic_bridge_deployment.sh"

packages:
  - tmux
  - speedtest-cli
  - nano
  - htop
  - git
  - zip
  - nala
  - curl
  - neovim
  - ca-certificates
  - jq
  - wget
  - ufw


###############################################################################
## SYSTEM MAINTENANCE PLAYBOOK KNOBS
##
## Used by `ansible-playbook system-maintenance.yml`.
## Anything uncommented here overrides the role defaults in
## roles/<role>/defaults/main.yml. Values may also be set per node in
## inventory/all, which takes priority over this file.
###############################################################################

## BATCHING
## How many hosts are maintained at once. Keep this well below your total node
## count when many VMs share one hypervisor: each batch restarts nym-node and
## runs fstrim, and doing that on 20+ guests simultaneously will stall shared
## storage.
##
## NOTE: `serial` is a play keyword, not a task variable. Ansible resolves it
## before group_vars is applied, so setting maintenance_serial HERE HAS NO
## EFFECT. Pass it on the command line instead:
##
##     ansible-playbook system-maintenance.yml -e maintenance_serial=4
##
## or edit the `serial:` line at the top of playbooks/system-maintenance.yml.
## The built-in default is 25% of the targeted hosts.


## ROLE TOGGLES
## Every role can be switched off individually.

# enable_journald_limits: true
# enable_nymnode_logging: true
# disable_rsyslog: true
# enable_classic_log_cleanup: true
# enable_journal_vacuum: true
# enable_apt_cleanup: true
# enable_snap_cleanup: true
# enable_fstrim: true
# enable_writeback_tuning: false


## JOURNALD LIMITS
## Written to /etc/systemd/journald.conf.d/10-nym-limits.conf as a drop-in,
## leaving the distro's own journald.conf untouched.

# journald_system_max_use: "100M"        # max persistent journal size
# journald_runtime_max_use: "50M"        # max runtime journal size
# journald_system_max_file_size: "25M"   # max single journal file
# journald_runtime_max_file_size: "10M"  # max runtime journal file
# journald_max_retention_sec: "3day"     # retention time

# journald_rate_limit_interval: "30s"    # rate limit window
# journald_rate_limit_burst: "1000"      # rate limit burst


## NYM-NODE LOG CONTROL
##
## nym-node logs to stderr via `tracing` and honours RUST_LOG. That is the only
## working way to reduce its verbosity.
##
## Do NOT set systemd LogLevelMax= for nym-node. journald stamps everything a
## service writes to stdout/stderr with SyslogLevel= (default "info"), so
## LogLevelMax=warning throws away every line the binary produces - including
## its errors - and the node looks silent while running fine.
##
##   info   upstream default, keeps packet counters and health-check lines
##   warn   warnings and errors only
##   error  errors only

# nymnode_rust_log: "info"
# nymnode_rate_limit_interval: "30s"     # per nym-node rate limit window
# nymnode_rate_limit_burst: "200"        # per nym-node rate limit burst
# nymnode_restart_on_change: true        # restart nym-node when the drop-in changes

nymnode_unit_name: "nym-node"            # systemd unit name, used by several roles


## JOURNAL VACUUM TARGETS

# journal_vacuum_size: "100M"
# journal_vacuum_time: "3days"


## CLASSIC LOG CLEANUP
## Removes the legacy rsyslog-written files. If rsyslog is still running the
## files are truncated instead of deleted, because deleting a file an active
## writer holds open does not free the space.

# classic_log_run_logrotate: true


## APT CLEANUP
## apt_remove_lists reclaims ~50-150MB but breaks `apt install` until the next
## `apt update`. Leave off unless disk pressure is severe.

# apt_remove_lists: false


## SNAP CLEANUP

# snap_retain_revisions: 2               # lowest value snapd accepts


## FSTRIM SCHEDULE
##
## Only returns space to the hypervisor if the guest disk was attached with
## discard support (discard='unmap'). The role checks and warns if not.
## Keep fstrim_randomized_delay well above zero when many VMs share a host,
## otherwise every guest trims on the same tick.

# fstrim_every_calendar: "hourly"        # Less aggressive
# fstrim_every_calendar: "hourly"        # Less aggressive
# fstrim_randomized_delay: "600"         # jitter in seconds, spreads the I/O
# fstrim_run_now: true                   # also trim once during the run


## WRITEBACK TUNING
## Enabled via `enable_writeback_tuning` under ROLE TOGGLES above.
## Batches writeback so shared storage sees fewer small writes, at the cost of
## a wider data-loss window on unclean shutdown.

# writeback_dirty_writeback_centisecs: 1500
# writeback_dirty_expire_centisecs: 6000
