- name: Ensure install directory exists
  file:
    path: "{{ nym_install_dir }}"
    state: directory
    mode: "0755"
  tags: quic

- name: Download quic_bridge_deployment.sh
  command:
    cmd: "curl -fsSL {{ quic_bridge_deployment_url }} -o {{ nym_install_dir }}/quic_bridge_deployment.sh"
  tags: quic

- name: Set quic_bridge_deployment permissions
  file:
    path: "{{ nym_install_dir }}/quic_bridge_deployment.sh"
    mode: "0755"
  tags: quic

- name: Run quic_bridge_deployment.sh
  become: true
  command:
    cmd: "{{ nym_install_dir }}/quic_bridge_deployment.sh {{ item }}"
  environment:
    NONINTERACTIVE: "1"
  loop:
    - full_bridge_setup
  tags: quic
