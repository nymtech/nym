[package]
name = "nym-http-api-client"
description = "Nym's HTTP API client, examples, and tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tunneling", "tls-ring"]
tunneling = []
# rustls crypto provider for reqwest, the gateway websockets and the DoT/DoH resolver.
# ring wins when both are enabled.
tls-ring = ["rustls/ring", "hickory-resolver/tls-ring", "hickory-resolver/https-ring"]
tls-aws-lc-rs = ["rustls/aws-lc-rs", "hickory-resolver/tls-aws-lc-rs", "hickory-resolver/https-aws-lc-rs"]
network-defaults = ["nym-network-defaults/network"]
debug-inventory = ["nym-http-api-client-macro/debug-inventory"]

[dependencies]
async-trait = { workspace = true }
bincode = { workspace = true }
cfg-if = { workspace = true}
reqwest = { workspace = true, features = ["json", "gzip", "deflate", "brotli", "zstd", "rustls"] }
http.workspace = true
url = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true}
serde_plain = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
itertools = { workspace = true }
inventory = { workspace = true }
fastrand = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# used for decoding text responses (they were already implicitly included)
bytes = { workspace = true }
encoding_rs = { workspace = true }
mime = { workspace = true }

nym-http-api-common = { workspace = true }
nym-bin-common = { workspace = true }
nym-network-defaults = { workspace = true }
nym-http-api-client-macro = { workspace = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
arc-swap = { workspace = true }
h2 = { workspace = true }
hickory-resolver = { workspace = true, features = ["webpki-roots"] }
rustls = { workspace = true, features = ["std", "tls12"] }
webpki-roots = { workspace = true }

# for request timeout until https://github.com/seanmonstar/reqwest/issues/1135 is fixed
[target."cfg(target_arch = \"wasm32\")".dependencies.wasmtimer]
workspace = true
features = ["tokio"]

[dev-dependencies]
tracing-subscriber.workspace = true
serial_test = { workspace = true }

[lints]
