[package]
name = "nym-swizzle-zcash"
description = "Zcash light-client privacy hygiene on top of nym-swizzle: quantized sync ranges and decoupled, persistable broadcast scheduling"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
repository = "https://github.com/nymtech/nym/sdk/rust/nym-swizzle-zcash/"
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
publish = true

# Like `nym-swizzle`, every non-dev dependency must compile for
# `wasm32-unknown-unknown`. The crate performs no I/O itself — the gRPC/TLS
# stack below is dev-only, for the live example and the opt-in network tests.

[features]
# `serde` is on by default so `BroadcastPlan`/`StoredPlan` serialize out of
# the box; disable with `default-features = false` (the wasm guarantee is
# checked in both configurations)
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
futures = { workspace = true }
nym-swizzle = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

[[example]]
name = "wallet_sync"
# the example persists plans as JSON through the PlanStore slot
required-features = ["serde"]

[dev-dependencies]
# tonic-prost 0.14 is built against prost 0.14, not the workspace's 0.13
prost = "0.14"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
