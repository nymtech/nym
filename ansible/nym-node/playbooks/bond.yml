---
- name: Nym node bonding
  hosts: all    # or a specific host/group
  gather_facts: false

  # Ubuntu's apt-daily.timer / unattended-upgrades hold the dpkg frontend lock
  # in the background. The apt module waits only 60s by default, which is
  # shorter than a kernel upgrade takes, so tasks fail on otherwise healthy
  # nodes. Set once here so every apt task in every role inherits it.
  serial: 1
 
  roles:
    - role: postinstall
