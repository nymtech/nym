name: Bump crate versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (e.g. 1.21.0)"
        required: true
        type: string

env:
  CI_BOT_AUTHOR: "Nym bot"
  CI_BOT_EMAIL: "nym-bot@users.noreply.github.com"

jobs:
  version-bump:
    runs-on: arc-linux-latest
    env:
      RUSTUP_PERMIT_COPY_RENAME: 1
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.name "${{ env.CI_BOT_AUTHOR }}"
          git config --global user.email "${{ env.CI_BOT_EMAIL }}"

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version format
        run: |
          if ! npx semver "${{ inputs.version }}"; then
            echo "Error: '${{ inputs.version }}' is not valid semver"
            exit 1
          fi

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP '^\s*version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update workspace dependencies
        run: |
          # Match any semver version on lines with `path = `, not just the current workspace version.
          # This catches entries whose version has drifted (e.g. nym-sqlx-pool-guard at 1.2.0).
          sed -i '/path = /s/version = "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/version = "${{ inputs.version }}"/g' Cargo.toml

      - name: Bump versions
        run: |
          cargo workspaces version custom ${{ inputs.version }} \
            --no-git-commit \
            --yes

      - name: Bump docs version constants and Cargo.toml snippets
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          DOCS=documentation/docs

          # Rust crate constants in the centralised versions file. The TypeScript
          # package constants (MIX_FETCH_VERSION etc.) track separate npm releases,
          # so they are intentionally left untouched.
          sed -i -E "s/(export const NYM_SDK_VERSION = )\"[^\"]*\"/\1\"${VERSION}\"/" "$DOCS/components/versions.ts"
          sed -i -E "s/(export const SMOLMIX_VERSION = )\"[^\"]*\"/\1\"${VERSION}\"/" "$DOCS/components/versions.ts"

          # Hardcoded Cargo.toml snippets. Match the crate key at the start of a
          # fenced-block line and rewrite whatever semver it carries, so a drifted
          # snippet self-heals the same way the workspace path-dep sed above does.
          # cargo-workspaces unifies every workspace crate to VERSION, so all of
          # these crates share it after the bump.
          sed -i -E "s/^(nym-sdk|nym-bin-common|nym-network-defaults|smolmix)(.*)\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\2\"${VERSION}\"/" \
            "$DOCS/pages/developers/rust/importing.mdx" \
            "$DOCS/pages/developers/rust/mixnet/tutorial.mdx" \
            "$DOCS/pages/developers/rust/stream/tutorial.mdx" \
            "$DOCS/pages/developers/rust/client-pool/tutorial.mdx" \
            "$DOCS/pages/developers/smolmix.mdx"

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          BASE_BRANCH="${GITHUB_REF_NAME}"
          PR_BRANCH="ci/crates-version-bump-${{ inputs.version }}-${GITHUB_RUN_ID}"

          git checkout -b "$PR_BRANCH"
          git add -A
          git commit -m "crates release: bump version to ${{ inputs.version }}"
          git push -u origin "$PR_BRANCH"

          cat > /tmp/crates-version-bump-pr-body.md <<'EOF'
          This PR was created by CI because direct pushes to the release branch are blocked by branch protection rules.

          ## Summary
          - Bump workspace crate versions to the requested release version.
          - Update workspace dependency versions accordingly.

          ## Notes
          - Merge this PR to proceed with crates.io publishing.
          EOF

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PR_BRANCH" \
            --title "crates release: bump version to ${{ inputs.version }}" \
            --body-file /tmp/crates-version-bump-pr-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show package versions
        run: cargo workspaces list --long
