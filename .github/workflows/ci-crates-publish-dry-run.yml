name: Publish to crates.io (dry run)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.21.0)"
        required: true
        type: string

env:
  CI_BOT_AUTHOR: "Nym bot"
  CI_BOT_EMAIL: "nym-bot@users.noreply.github.com"

jobs:
  publish-dry-run:
    runs-on: arc-linux-latest
    # Raised from 35: the semver gate below builds rustdoc for every published
    # crate plus its crates.io baseline. Tune down once a real run is measured.
    timeout-minutes: 90
    env:
      RUSTUP_PERMIT_COPY_RENAME: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.name "${{ env.CI_BOT_AUTHOR }}"
          git config --global user.email "${{ env.CI_BOT_EMAIL }}"

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version format
        run: |
          if ! npx semver "${{ inputs.version }}"; then
            echo "Error: '${{ inputs.version }}' is not valid semver"
            exit 1
          fi

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP '^\s*version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update workspace dependencies
        run: |
          # Match any semver version on lines with `path = `, not just the current workspace version.
          sed -i '/path = /s/version = "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/version = "${{ inputs.version }}"/g' Cargo.toml

      - name: Bump versions (local only)
        run: |
          cargo workspaces version custom ${{ inputs.version }} \
            --no-git-commit \
            --yes

      # Cheap check first: a broken manifest should fail in seconds, before the
      # slow rustdoc build in the semver gate below.
      - name: Preflight publish checks
        run: |
          python3 tools/internal/check_publish_preflight.py

      - name: Cache Rust build artifacts
        # Persists target/ so the rustdoc builds below are warm on reruns; only the
        # first cold run pays the full build cost.
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks

      - name: Semver check (release gate)
        # The bump above wrote the target version into every manifest, so
        # cargo-semver-checks reads it as current and compares each crate against its
        # latest crates.io release, failing when the target version is too small a
        # bump for the API break it finds. This stops such a break going out under a
        # minor or patch number. It catches the breaks the tool has lints for:
        # removed or renamed items, changed arity or generic arity, and trait
        # changes. It does not catch a parameter-type change, nor a behavioural break
        # behind an unchanged signature.
        # Scope: the nym-sdk published dependency closure, computed from the lockfile
        # so it tracks the dep tree. These are the crates a library consumer can be
        # broken by; the rest of the workspace is published only by lockstep and has
        # no external library consumers. publish = false crates in the closure are
        # skipped by the tool.
        run: |
          set -euo pipefail
          mapfile -t closure < <(
            cargo tree -p nym-sdk --all-features --edges normal --prefix none --target all \
              | grep -oE '^nym-[a-z0-9_-]+' | sort -u
          )
          # A closure crate with no crates.io release yet is a hard error in the
          # tool, not a skip, so leave it out until its first publish. We read that
          # from the sparse index rather than hardcoding names, so a new crate drops
          # out on its own and rejoins the gate the day it ships. The step already
          # reaches crates.io for baselines, so this adds no new dependency.
          # Index path is first-two-chars/next-two-chars/name for any name of four or
          # more characters; every nym-* name qualifies. A transient index failure
          # reads as "no release" and skips the crate, which is a missed check, not a
          # false red.
          args=()
          for c in "${closure[@]}"; do
            if curl -sfo /dev/null "https://index.crates.io/${c:0:2}/${c:2:2}/$c"; then
              args+=(--package "$c")
            else
              echo "Skipping $c: no crates.io release yet"
            fi
          done
          echo "Semver-checking ${#args[@]} crates in the nym-sdk closure"
          cargo semver-checks "${args[@]}"

      # Dry run may show cascading dependency errors because packages aren't
      # actually uploaded - these are expected and ignored. We check for real
      # errors like packaging failures, missing metadata, or invalid Cargo.toml.
      - name: Publish (dry run)
        run: |
          set +e
          publish_status=1
          max_attempts=2
          attempt=1
          rm -f /tmp/publish-dry-run.log

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Dry-run publish attempt ${attempt}/${max_attempts}"
            cargo workspaces publish --dry-run --allow-dirty 2>&1 | tee /tmp/publish-dry-run.log
            publish_status=${PIPESTATUS[0]}

            if [ "$publish_status" -eq 0 ]; then
              break
            fi

            # Retry once for interruption/runner issues.
            if [ "$attempt" -lt "$max_attempts" ] && \
              { [ "$publish_status" -eq 130 ] || [ "$publish_status" -eq 137 ]; }; then
              echo "Publish dry-run interrupted (exit ${publish_status}), retrying in 10s..."
              sleep 10
              attempt=$((attempt + 1))
              continue
            fi

            break
          done
          set -e

          if grep -Eiq \
            "failed to verify manifest|failed to parse manifest|invalid Cargo.toml|error: package .* has no (description|license|repository)" \
            /tmp/publish-dry-run.log; then
            echo "Detected real packaging/manifest errors"
            exit 1
          fi

          # In dry-run mode, non-zero publish status is expected due to
          # dependency-cascade failures against crates.io index.
          if [ "$publish_status" -ne 0 ]; then
            echo "Dry-run publish returned non-zero (${publish_status}) but no real manifest blockers were detected."
          fi

          echo "Only expected dry-run dependency cascade errors detected (if any)."

      # Show the list of packages published
      - name: Show package versions
        run: cargo workspaces list --long
