[package]
name = "nym-bandwidth-fetcher"
description = "Crate for fetching zknym credentials"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
zeroize = { workspace = true }

nym-credentials = { workspace = true }
nym-bandwidth-controller = { workspace = true }
nym-crypto = { workspace = true }
nym-ecash-time = { workspace = true }
nym-validator-client = { workspace = true }

# the pending-credential-requests store is sqlite-backed, so it (and its deps) are native-only
[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
sqlx = { workspace = true }
nym-sqlx-pool-guard = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# exposes `NyxdRecoveryFetcher`, a recover-only fetcher usable with a plain query client
recovery = []

[lints]
workspace = true
