[package]
name = "nym-bandwidth-fetcher"
description = "Crate for fetching zknym credentials"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
zeroize = { workspace = true }

nym-credentials = { workspace = true }
nym-bandwidth-controller = { workspace = true }
nym-crypto = { workspace = true }
nym-ecash-time = { workspace = true }
nym-validator-client = { workspace = true }

# the pending-credential-requests store is sqlite-backed, so it (and its deps) are native-only
# and gated behind the `credentials` feature.
[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
# list the sqlx features this crate uses directly: `query!`/`query_as` (macros),
# `migrate!` (migrate), and `Date` columns (time). Do not rely on another crate
# in the graph to unify them in; the feature-powerset check builds this crate alone.
sqlx = { workspace = true, optional = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "time",
] }
nym-sqlx-pool-guard = { workspace = true, optional = true }

[build-dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# native credential issuance/import, backed by a sqlite pending-requests store.
# exposes `NyxdCredentialFetcher` and pulls in sqlx. The storage-free
# `NyxdGlobalDataFetcher` is always available and needs none of this.
credentials = ["dep:sqlx", "dep:nym-sqlx-pool-guard"]

# exposes `NyxdRecoveryFetcher`, a recover-only fetcher; implies `credentials`
# since it uses the same pending-requests store.
recovery = ["credentials"]

[lints]
workspace = true
