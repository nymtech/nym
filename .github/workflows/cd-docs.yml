name: cd-docs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: arc-ubuntu-22.04
    env:
      NEXT_PUBLIC_SITE_URL: https://nym.com/docs
    defaults:
      run:
        working-directory: documentation/docs
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget libssl-dev libudev-dev squashfs-tools protobuf-compiler git python3 && sudo apt-get update --fix-missing
      - name: Install Python3 modules
        run: sudo apt install -y python3-pandas python3-tabulate
      - name: Install rsync
        run: sudo apt-get install -y rsync
      - uses: rlespinasse/github-slug-action@v3.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}
      - name: Build all binaries
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --workspace --release

      - name: Verify doc versions
        run: ${{ github.workspace }}/documentation/scripts/verify-doc-versions.sh
        working-directory: ${{ github.workspace }}
      - name: Install project dependencies
        run: pnpm i
      # Embedding vectors are keyed by chunk content hash, so a restored cache
      # means only changed chunks are re-embedded. Vercel gets this for free by
      # restoring node_modules/.cache between builds; a GitHub runner starts
      # clean, so without this the whole corpus is re-embedded on every deploy.
      # restore-keys matters more than an exact hit: any recent cache still
      # covers the chunks that did not change.
      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: documentation/docs/node_modules/.cache/nym-docs
          key: nym-embed-${{ hashFiles('documentation/docs/pages/**', 'documentation/docs/lib/retrieval/chunker.mjs', 'documentation/docs/lib/retrieval/code-chunker.mjs') }}
          restore-keys: |
            nym-embed-
      - name: Generate llms-full.txt
        run: pnpm run generate:llms
      # The embedding key is set per build step rather than on the job, so it is not
      # in the environment for `cargo build`, `pnpm i`, `npm install -g vercel` or the
      # third-party actions, all of which execute code from outside this repo.
      # Both this step and the `vercel build` steps below can run the index
      # generators, so all three need it. Runtime query embedding is separate and
      # comes from the Vercel project env via `vercel pull`.
      - name: Build project
        run: pnpm run build
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # This job publishes, so a missing key must fail it rather than ship an index
          # with no vectors that returns nothing for every query. Check-only workflows
          # build without the key on purpose and are unaffected.
          REQUIRE_EMBEDDINGS: "1"
      - name: Generate sitemap
        run: npx next-sitemap
      - name: Move files to /dist/
        run: ../scripts/move-to-dist.sh

      - name: Create Vercel project file
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.VERCEL_PROJECT_JSON_BASE64 }}
          filename: "project.json"
          is-executable: true
          working-directory: "./dist/docs/.vercel"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        continue-on-error: false

      - name: Pull Vercel Environment Information (preview)
        if: github.ref != 'refs/heads/master'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
      - name: Pull Vercel Environment Information (production)
        if: github.ref == 'refs/heads/master'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
        continue-on-error: false

      - name: Build Project Artifacts (preview)
        if: github.ref != 'refs/heads/master'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
        continue-on-error: false
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          REQUIRE_EMBEDDINGS: "1"
      - name: Build Project Artifacts (production)
        if: github.ref == 'refs/heads/master'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
        continue-on-error: false
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          REQUIRE_EMBEDDINGS: "1"

      - name: Deploy Project Artifacts to Vercel (preview)
        if: github.ref != 'refs/heads/master'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
      - name: Deploy Project Artifacts to Vercel (master)
        if: github.ref == 'refs/heads/master'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: dist/docs
        continue-on-error: false
