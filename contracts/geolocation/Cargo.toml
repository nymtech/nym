[package]
name = "nym-geolocation-contract"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false

[[bin]]
name = "schema"
required-features = ["schema-gen"]

[lib]
name = "nym_geolocation_contract"
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { workspace = true }
cw2 = { workspace = true }
cw-storage-plus = { workspace = true }
cw-controllers = { workspace = true }

nym-geolocation-contract-common = { workspace = true }
cosmwasm-schema = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
nym-contracts-common-testing = { workspace = true }

[features]
schema-gen = ["nym-geolocation-contract-common/schema", "cosmwasm-schema"]


[lints]
workspace = true
