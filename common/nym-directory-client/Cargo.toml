[package]
name = "nym-directory-client"
description = "Library for retrieving verifiable Nym directory"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
cosmrs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

nym-contract-anchor = { workspace = true }
nym-contract-attestation = { workspace = true }
nym-lthash = { workspace = true, features = ["serde"] }
nym-crypto = { workspace = true, features = ["asymmetric"] }
nym-validator-client = { workspace = true, features = ["http-client"] }
nym-directory-contract-common = { workspace = true }
nym-mixnet-contract-common = { workspace = true }

[dev-dependencies]
nym-crypto = { workspace = true, features = ["rand"] }
nym-test-utils = { workspace = true, features = ["crypto-helpers"] }
cw-storage-plus = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
nym-contract-attestation = { workspace = true, features = ["mock"] }
# not optional here (unlike the anchor crate): `test_support`'s nym-api mock uses
# `ApiClientCore` unconditionally
nym-http-api-client = { workspace = true }

# pure forwards - both features gate code that now lives in nym-contract-anchor
[features]
https-checkpoint-fetcher = ["nym-contract-anchor/https-checkpoint-fetcher"]
light-client = ["nym-contract-anchor/light-client"]

[lints]
workspace = true
