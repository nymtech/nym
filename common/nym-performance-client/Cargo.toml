[package]
name = "nym-performance-client"
description = "Library for verifiable retrieval of Nym performance data"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

[dependencies]
async-trait = { workspace = true }

nym-crypto = { workspace = true, features = ["asymmetric"] }
nym-lthash = { workspace = true }

nym-contract-anchor = { workspace = true }
nym-contract-attestation = { workspace = true }
nym-performance-contract-common = { workspace = true }
nym-validator-client = { workspace = true }

[dev-dependencies]
nym-contract-attestation = { workspace = true, features = ["mock"] }
nym-test-utils = { workspace = true, features = ["crypto-helpers"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
