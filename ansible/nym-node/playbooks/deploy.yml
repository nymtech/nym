---
- name: "Deploy Nym node"
  hosts: all    # or a specific host/group
  become: true

  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300

  roles:
    - base
    - nym

    # nginx: landing page, reverse proxy and WSS. Runs on every gateway (entry
    # and exit). Off for mixnodes by default - set nginx_enabled=true in the
    # inventory if your mixnode has a hostname and should get the reverse proxy.
    # Needs `hostname` (DNS pointing to the node) and `email` for the certificate.
    - role: nginx
      when: nginx_enabled | default(mode != 'mixnode') | bool
    # NTM runs on exit gateways and any WireGuard gateway and owns their firewall.
    # A non-WireGuard entry-gateway is ufw-managed (see roles/nym/tasks/main.yml).
    - role: tunnel
      when: mode == 'exit-gateway' or (wireguard_enabled | default(false) | bool)
    # QUIC bridge runs on every gateway (entry and exit).
    - role: quic
      when: mode != 'mixnode'
