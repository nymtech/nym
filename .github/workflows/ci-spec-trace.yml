name: ci-spec-trace

# The spec trace gate on each PR (the spec-traceability spec).
# Tracey reads the specs and the code paths that .config/tracey/config.styx names. The job fails
# on a marker that names an unknown id or an old version, and on an id that two specs define.
# The job also fails on a requirement with no code, no test or no r[id] line, and lists each one.
#
# There is no path filter. A workflow that a path filter skips sends no status, so a required
# check on it stays pending and the PR cannot merge.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-spec-trace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TRACEY_VERSION: v1.4.0
  TRACEY_SHA256: 41d1360015f670b5d985b296aa7e727e3dcdb7ca04fc7834eb35d969a82ca9e5

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Tracey
        run: |
          name=tracey-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/bearcove/tracey/releases/download/$TRACEY_VERSION/$name.tar.xz"
          echo "$TRACEY_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/$name/tracey" "$RUNNER_TEMP/bin/tracey"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Canary
        # The gate must fail on a marker with an unknown id, on a requirement with no marker and on a
        # requirement with no r[id] line, in paths that the config names. This step runs first so
        # that its query starts the Tracey daemon after the files exist. The daemon does not see a new
        # file at once, so `tracey kill` stops it before the gate runs.
        run: |
          canary_spec=openspec/changes/add-mixnet-core-specs/specs/canary
          mkdir "$canary_spec"
          printf '%s\n' '## ADDED Requirements' '' '### Requirement: Canary gap' '' 'r[canary.gap]' 'A requirement with no marker.' '' \
            '### Requirement: Canary with no id' '' 'A requirement with no r[id] line.' > "$canary_spec/spec.md"
          printf '%s\n' '// r[impl canary.unknown]' 'pub fn canary() {}' > common/nymsphinx/src/canary.rs
          if tracey query validate --deny warnings > "$RUNNER_TEMP/canary.log" 2>&1; then
            cat "$RUNNER_TEMP/canary.log"; echo "canary: the gate passed an unknown id"; exit 1
          fi
          grep -q canary.unknown "$RUNNER_TEMP/canary.log" || { cat "$RUNNER_TEMP/canary.log"; exit 1; }
          if tools/internal/spec-trace-gaps.sh > "$RUNNER_TEMP/canary-gaps.log" 2>&1; then
            cat "$RUNNER_TEMP/canary-gaps.log"; echo "canary: the gaps check passed two planted gaps"; exit 1
          fi
          grep -q canary.gap "$RUNNER_TEMP/canary-gaps.log" && grep -q 'Canary with no id' "$RUNNER_TEMP/canary-gaps.log" \
            || { cat "$RUNNER_TEMP/canary-gaps.log"; exit 1; }
          rm -r "$canary_spec" common/nymsphinx/src/canary.rs
          tracey kill

      - name: Spec trace gate
        # If two specs define the same id, Tracey 1.4.0 reports CONFIG ERROR and exits 0, so the grep fails the step.
        run: |
          tracey query validate --deny warnings > "$RUNNER_TEMP/gate.log" 2>&1 || { cat "$RUNNER_TEMP/gate.log"; exit 1; }
          cat "$RUNNER_TEMP/gate.log"
          if grep -q 'CONFIG ERROR' "$RUNNER_TEMP/gate.log"; then exit 1; fi

      - name: Gaps
        # A requirement with no impl marker, no verify marker or no r[id] line fails the job.
        run: |
          set -o pipefail
          tools/internal/spec-trace-gaps.sh | tee -a "$GITHUB_STEP_SUMMARY"
