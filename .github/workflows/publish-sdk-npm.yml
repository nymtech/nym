name: publish-sdk-npm
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the publish (pnpm publish --dry-run, no tarballs uploaded). Untick to publish for real."
        type: boolean
        default: true
      dist_tag:
        description: "Tag mode. 'auto' picks per package: new packages and same-major releases -> latest; a breaking major (e.g. mix-fetch v2 over v1) -> next, promote later with `npm dist-tag add`. 'next'/'latest' force that tag on all four."
        type: choice
        options:
          - auto
          - next
          - latest
        default: auto
      skip_smoke:
        description: "Publish even if the browser smoke test fails. Only for a mixnet outage blocking an urgent release."
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}
          override: true
          components: rustfmt, clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: cargo install wasm-opt

      - name: Install dependencies
        run: pnpm i

      - name: Build WASM and Typescript SDK
        run: pnpm sdk:build

      # Webpacks internal-dev against wasm/smolmix/pkg, which `pnpm sdk:build` has
      # just filled with the release wasm, so this tests the bytes being published.
      # Not `make dev-build`: it rebuilds pkg/ with `--features debug` and would
      # replace them.
      - name: Smoke test the release wasm in a browser
        if: ${{ !inputs.skip_smoke }}
        run: |
          (cd wasm/smolmix/internal-dev && pnpm install --ignore-workspace && ./node_modules/.bin/webpack --mode production)
          (cd wasm/smolmix/tests && pnpm install && pnpm exec playwright install --with-deps chromium firefox)
          make -C wasm/smolmix test:smoke

      - name: Upload smoke test traces
        if: ${{ failure() && !inputs.skip_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: wasm/smolmix/tests/test-results/
          retention-days: 7

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: ./sdk/typescript/scripts/publish.sh
