[package]
name = "nym-credential-storage"
description = "Crate for handling and storing spent and unspent zknym ticketbooks"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
bincode = { workspace = true, optional = true }

log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }

nym-credentials = { workspace = true }
nym-compact-ecash = { workspace = true }
nym-ecash-time = { workspace = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies.sqlx]
workspace = true
optional = true
features = ["runtime-tokio", "sqlite", "macros", "migrate", "time"]

[target."cfg(not(target_arch = \"wasm32\"))".dependencies.nym-sqlcipher]
workspace = true
optional = true

[target."cfg(not(target_arch = \"wasm32\"))".dependencies.tokio]
workspace = true
features = ["rt-multi-thread", "net", "signal", "fs"]


[dev-dependencies]
anyhow = { workspace = true }
nym-crypto = { workspace = true, features = ["asymmetric", "rand"] }
nym-test-utils = { workspace = true }
nym-credentials-interface = { workspace = true }
nym-compact-ecash = { workspace = true }


[build-dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
persistent-storage = ["bincode", "serde", "dep:sqlx"]
# SQLCipher-encrypted persistent storage. Builds the bundled SQLCipher in place of SQLite for the
# whole dependency graph, since every crate shares the single `libsqlite3-sys` linking `sqlite3`.
sqlcipher = ["persistent-storage", "dep:nym-sqlcipher", "nym-sqlcipher/bundled"]
# Same as `sqlcipher`, but also builds OpenSSL from source for SQLCipher's crypto, instead of
# linking the system OpenSSL. Needs a C toolchain and Perl, no OpenSSL dev libraries.
sqlcipher-vendored-openssl = ["sqlcipher", "nym-sqlcipher/vendored-openssl"]

[lints]
