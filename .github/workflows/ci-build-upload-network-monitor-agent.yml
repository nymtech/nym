name: ci-build-upload-network-monitor-agent

on:
  workflow_dispatch:

env:
  S3_ENDPOINT: https://s3.nymte.ch
  S3_BUCKET: builds

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        platform: [arc-ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_PERMIT_COPY_RENAME: 1

    steps:
      - uses: actions/checkout@v6

      - name: Prepare build output directory
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/${{ github.ref_name }}
        run: |
          rm -rf ci-builds || true
          mkdir -p "$OUTPUT_DIR"

      - name: Install Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get -y install libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ vars.REQUIRED_RUSTC_VERSION }}

      - name: Build nym-network-monitor-agent
        shell: bash
        run: cargo build -p nym-network-monitor-agent --release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nym-network-monitor-agent
          path: target/release/nym-network-monitor-agent
          retention-days: 30

      - name: Prepare build output
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/${{ github.ref_name }}
        run: cp target/release/nym-network-monitor-agent "$OUTPUT_DIR"

      - name: Publish agent build to S3
        uses: ./.github/actions/push-to-s3
        with:
          source_path: ci-builds/
          destination: ""
          endpoint: ${{ env.S3_ENDPOINT }}
          bucket: ${{ env.S3_BUCKET }}
          aws_access_key_id: ${{ secrets.GARAGE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.GARAGE_AWS_SECRET_ACCESS_KEY }}
