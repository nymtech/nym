name: ci-docs-validation

# Blocking gate: the docs-vs-code checkers. They are dependency-free Node scripts
# (no npm/pnpm install needed) that read the Rust/TS source directly, so they run
# fast and cannot be flaked by the dependency graph. A non-zero exit fails the job.
#
# Triggers on changes to the docs and to the specific source the oracles read, so a
# constant or type that a page depends on cannot move without this running.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "documentation/**"
      - "Cargo.toml"
      - "common/nymsphinx/params/**"
      - "common/network-defaults/**"
      - "common/client-core/config-types/**"
      - "wasm/smolmix/src/state.rs"
      - "sdk/typescript/packages/mix-tunnel/src/types.ts"
      - ".github/workflows/ci-docs-validation.yml"

jobs:
  validate:
    runs-on: arc-linux-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each checker runs its self-test first (guards the checker's own logic), then
      # the live scan against the tree (the actual gate).
      - name: Numeric claims vs source constants (self-test)
        run: node documentation/scripts/next-scripts/validate-docs-vs-code.mjs --selftest

      - name: Numeric claims vs source constants
        run: node documentation/scripts/next-scripts/validate-docs-vs-code.mjs

      - name: Rust/TS enum parity (self-test)
        run: node documentation/scripts/next-scripts/validate-enum-parity.mjs --selftest

      - name: Rust/TS enum parity
        run: node documentation/scripts/next-scripts/validate-enum-parity.mjs
