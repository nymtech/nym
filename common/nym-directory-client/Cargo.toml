[package]
name = "nym-directory-client"
description = "Library for retrieving verifiable Nym directory"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = true

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
ics23 = { workspace = true, features = ["host-functions"] }
prost = { workspace = true }
cosmrs = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tendermint-light-client = { workspace = true, optional = true }

nym-directory-attestation = { workspace = true }
nym-lthash = { workspace = true, features = ["serde"] }
nym-crypto = { workspace = true, features = ["asymmetric"] }
nym-network-defaults = { workspace = true }
nym-validator-client = { workspace = true, features = ["http-client"] }
nym-directory-contract-common = { workspace = true }
nym-mixnet-contract-common = { workspace = true }

[dev-dependencies]
nym-crypto = { workspace = true, features = ["rand"] }
nym-test-utils = { workspace = true, features = ["crypto-helpers"] }
anyhow = { workspace = true }
cw-storage-plus = { workspace = true }
nym-validator-client = { workspace = true, features = ["mocks"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
nym-directory-attestation = { workspace = true, features = ["mock"] }

[features]
light-client = ["tendermint-light-client"]

[lints]
workspace = true
