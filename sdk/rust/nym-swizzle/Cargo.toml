[package]
name = "nym-swizzle"
description = "Traffic-shape obfuscation utilities: randomized delay scheduling and overlapping range chunking for privacy-preserving applications"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
repository = "https://github.com/nymtech/nym/sdk/rust/nym-swizzle/"
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
publish = true

[dependencies]
futures = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmtimer = { workspace = true, features = ["tokio"] }
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
