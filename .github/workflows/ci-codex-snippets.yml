name: ci-codex-snippets

# The snippet check on each PR (openspec/changes/add-codex-snippets, task 4.1).
# It builds every record (snippets, extracted code, threat model, OpenSpec
# requirements), runs the page check and link resolution, and compiles each
# snippet alone. It fails on an error. It also posts one PR comment with each
# cited code excerpt that the PR changes, as a diff, and the pages that show it.
#
# The path filter is static, so it cannot follow the citation list: any Rust
# change runs the check, because a Rust change can change a cited excerpt.

on:
  pull_request:
    paths:
      - "documentation/docs/.nym-codex/**"
      - "documentation/docs/content/**"
      - "documentation/docs/lib/snippets/**"
      - "documentation/docs/lib/retrieval/**"
      - "documentation/docs/lib/privacy-model/**"
      - "documentation/docs/components/**"
      - "documentation/docs/mdx-components.jsx"
      - "openspec/specs/**"
      - "**/*.rs"
      - ".github/workflows/ci-codex-snippets.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-codex-snippets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snippets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation/docs
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: pnpm i

      - name: Records, page check, and link resolution
        run: node lib/snippets/records.mts --out "$RUNNER_TEMP/records-head"
      - name: Compile each snippet alone
        run: node lib/snippets/compile.mts

      - name: Records at the base commit
        # The head's tools read the base tree. The outcome is written to base-state:
        # "ok", "none" (the base has no snippets yet: every citation is new), or
        # "unavailable" (the base records failed or have another layout: no diff).
        id: base
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          mkdir -p "$RUNNER_TEMP/records-base"
          if [ -f "$RUNNER_TEMP/base/documentation/docs/.nym-codex/manifest.json" ]; then
            if node lib/snippets/records.mts --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/records-base"; then
              echo "state=ok" >> "$GITHUB_OUTPUT"
            else
              echo "state=unavailable" >> "$GITHUB_OUTPUT"
            fi
          elif [ -f "$RUNNER_TEMP/base/.nym-codex/manifest.json" ]; then
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Excerpt comment
        # A PR from a fork has a read-only token, so the comment can fail there; the check does not.
        # The comment is found by its marker, never by its author: other workflows post as the same bot.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_STATE: ${{ steps.base.outputs.state }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          if [ "$BASE_STATE" = "unavailable" ]; then
            printf '%s\n' "<!-- nym-codex-snippets -->" "The records of the base commit could not be built with this PR's tools, so this check shows no excerpt diff. The check itself ran on the head." > "$body"
          else
            node lib/snippets/excerpt-diff.mts --base "$RUNNER_TEMP/records-base" --base-root "$RUNNER_TEMP/base" --head "$RUNNER_TEMP/records-head" > "$body"
          fi
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- nym-codex-snippets -->")) | .id' | head -n 1)
          if [ ! -s "$body" ]; then
            [ -z "$id" ] && { echo "No cited code excerpt changes."; exit 0; }
            printf '%s\n' "<!-- nym-codex-snippets -->" "No cited code excerpt changes in this PR now." > "$body"
          fi
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$id" -F "body=@$body"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" -F "body=@$body"
          fi
