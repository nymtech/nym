[package]
name = "nym-geolocator"
description = "Simple service for looking up locations of Nym nodes and publishing them to the smart contract"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
humantime = { workspace = true }
http = { workspace = true }
futures = { workspace = true }
ipinfo = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true, features = ["json", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

axum = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "time"] }
utoipauto = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
nym-http-api-common = { workspace = true, features = ["middleware"] }

nym-task = { workspace = true }
nym-bin-common = { workspace = true, features = ["basic_tracing"] }
nym-crypto = { workspace = true, features = ["asymmetric"] }
nym-node-requests = { workspace = true, features = ["client"] }
nym-validator-client = { workspace = true, features = ["http-client"] }
nym-network-defaults = { workspace = true, features = ["env"] }
nym-geolocation-contract-common = { workspace = true, features = ["payload", "utoipa"] }
nym-geolocator-requests = { workspace = true }


[lints]
workspace = true
