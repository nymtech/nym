packages:
  - "."

overrides:
  # nextra-theme-docs 4.6.1's <Layout> strips `children` from its props, then validates the
  # rest against a schema that still marks `children` required. zod 4.6.5 rejects the missing
  # field ('expected nonoptional, received undefined'), breaking every prerender; zod 4.1.12
  # tolerates it. Pin to 4.1.12 (codex's working version) until nextra ships a fix.
  zod: 4.1.12

allowBuilds:
  core-js: false
  protobufjs: false
  sharp: false
  tiny-secp256k1: false
  unrs-resolver: false
  # Native ws speedups; the browser bundle uses the JS implementations. Skip
  # their builds (and avoid native-compile failures in CI).
  bufferutil: false
  utf-8-validate: false
  esbuild: true
  # The snippet extractor loads the grammar's prebuilt .wasm with web-tree-sitter;
  # the native Node binding is not used, so its build is skipped.
  tree-sitter-rust: false

# pnpm's default 24h supply-chain cooldown guards against a compromised third-party
# package being published and yanked before anyone installs it. It does not apply to
# packages this repo publishes itself, and it otherwise blocks verifying the docs
# against a release on the day it is cut, plus any Vercel deploy for 24h after.
minimumReleaseAgeExclude:
  - "@nymproject/*"

# nextra 4.6.1 starts Shiki with all bundled languages in each MDX loader worker: about
# 4 s per worker, and Turbopack starts about one worker per core, all at once on the
# first page load of `pnpm dev`. rehype-pretty-code loads the language of each code
# block on demand, so the patch starts Shiki with none. The compiled output of all 1503
# MDX and Markdown files is the same, apart from one TS template literal that the es-tag-*
# injection grammars (loaded by ts-tags) no longer colour. Known limit: a ```md or ```mdx
# block loses the colours of the fences nested in it (none in the docs now). Drop the
# patch when nextra fixes it.
patchedDependencies:
  nextra@4.6.1: patches/nextra@4.6.1.patch
