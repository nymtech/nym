---
- name: Nym node bonding
  hosts: all    # or a specific host/group
  become: true          # postinstall reads /root/nym-binaries/nym-node
  gather_facts: false
  # Interactive: the postinstall role pauses and prompts the operator to paste a
  # contract message from their wallet. One host at a time, or the prompts from
  # every node interleave and become unusable.
  serial: 1

  roles:
    - role: postinstall