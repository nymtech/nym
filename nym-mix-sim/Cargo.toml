[package]
name = "nym-mix-sim"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "mix-client"
path = "src/bin/mix_client.rs"

[[bin]]
name = "nym-mix-sim"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
strum = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# 0.8 for the sphinx, crypto and pipeline APIs; 0.10 for LP key generation, seeded from the OS via
# `getrandom04`. `nym-node` carries the same pair for the same reason.
getrandom04.workspace = true
rand.workspace = true
rand010.workspace = true
rand_distr.workspace = true

nym-bin-common = { workspace = true, features = ["basic_tracing"] }
nym-common.workspace = true
nym-lp = { workspace = true, features = ["mock"] }
nym-lp-data.workspace = true
nym-test-utils.workspace = true
nym-node = { path = "../nym-node", features = ["mix-sim"] }
nym-sphinx.workspace = true
nym-sphinx-addressing.workspace = true
nym-sphinx-params.workspace = true
nym-topology.workspace = true
nym-crypto = { workspace = true, features = ["serde", "rand"] }

[lints]
workspace = true
