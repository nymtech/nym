[package]
name = "nym-network-monitor-orchestrator-requests"
description = "Request and response types for the Nym network monitor orchestrator API"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
time = { workspace = true, features = ["serde-well-known"] }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

nym-crypto = { workspace = true, features = ["asymmetric", "serde"] }
nym-http-api-client = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

# `rand` is only needed to generate key fixtures in tests; it pulls in the `KeyPair::new` /
# `PrivateKey::new` constructors the non-test build has no use for
nym-crypto = { workspace = true, features = ["asymmetric", "serde", "rand"] }
nym-test-utils = { workspace = true }

[features]
client = ["nym-http-api-client", "zeroize"]
openapi = ["utoipa"]

[lints]
workspace = true
