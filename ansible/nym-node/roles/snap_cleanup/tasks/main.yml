---
- name: Check whether snapd is present
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: snap_bin

- name: Read current snap refresh.retain
  ansible.builtin.command: snap get system refresh.retain
  register: snap_retain_current
  changed_when: false
  failed_when: false
  when: snap_bin.stat.exists

# `snap set` always exits 0, so keying changed_when to rc would report changed
# on every run. Compare against the current value instead.
- name: Limit how many snap revisions are retained
  ansible.builtin.command: "snap set system refresh.retain={{ snap_retain_revisions }}"
  register: snap_retain
  changed_when: true
  failed_when: false
  when:
    - snap_bin.stat.exists
    - (snap_retain_current.stdout | default('') | trim) != (snap_retain_revisions | string)

- name: List disabled snap revisions
  ansible.builtin.shell: |
    set -o pipefail
    snap list --all 2>/dev/null | awk '/disabled/{print $1 "," $3}' || true
  args:
    executable: /bin/bash
  register: snap_disabled
  changed_when: false
  failed_when: false
  when: snap_bin.stat.exists

- name: Remove disabled snap revisions
  ansible.builtin.command: "snap remove {{ item.split(',')[0] }} --revision={{ item.split(',')[1] }}"
  loop: "{{ (snap_disabled.stdout_lines | default([])) | select('search', ',') | list }}"
  loop_control:
    label: "{{ item }}"
  register: snap_removed
  changed_when: snap_removed.rc == 0
  failed_when: false
  when: snap_bin.stat.exists
